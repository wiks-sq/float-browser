<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src * data: blob:">
  <title>Float</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="viewport">
    <div id="sky">
      <div class="layer nebula"></div>
      <div class="layer stars far a"></div>
      <div class="layer stars far b"></div>
      <div class="layer stars mid a"></div>
      <div class="layer stars mid b"></div>
    </div>
    <div id="grid" class="layer"></div>
    <div id="vignette"></div>
    <div id="world"></div>
  </div>
  <div id="overlay"></div>
  <nav id="tabbar" aria-label="Open windows"><div class="tabs"></div><button class="tb-new" title="New window (Ctrl T)">+</button></nav>
  <div id="hint">
    <div class="big">Double-click anywhere to open a window</div>
    <div>or press <kbd>Ctrl</kbd> <kbd>T</kbd> · drag the empty space to move around</div>
  </div>
  <div id="zoombar">
    <button data-z="out" title="Zoom out (Ctrl −)">−</button>
    <button data-z="100" id="zoomlabel" title="Zoom to 100% (Ctrl 1)">100%</button>
    <button data-z="in" title="Zoom in (Ctrl +)">+</button>
    <button data-z="fit" title="Show everything (Ctrl 0)">⤢</button>
  </div>
  <div id="extbar" hidden title="Extensions (act on the selected window)"><browser-action-list partition="persist:drift" alignment="bottom left"></browser-action-list></div>
  <div id="cmenu" class="menu" tabindex="-1" hidden></div>
  <div id="spot-scrim" hidden></div>
  <div id="spot" class="menu" hidden>
    <div class="sbar"><span class="glass">⌕</span><input spellcheck="false" autocomplete="off"><span class="space" hidden></span></div>
    <div class="results"></div>
    <div class="foot"></div>
  </div>
  <div id="findbar" hidden><input placeholder="Find in page" spellcheck="false"><span class="count"></span></div>
  <button id="dlbtn" hidden title="Downloads (Ctrl J)"><span>↓</span></button>
  <div id="downloads" class="panel" hidden>
    <div class="head"><b>Downloads</b><span class="sp"></span><button class="open-folder">Open folder</button><button class="clear">Clear list</button><button class="close" title="Close">×</button></div>
    <div class="list"></div>
  </div>
  <div id="siteinfo" class="panel" hidden tabindex="-1"></div>
  <div id="settings-scrim" hidden></div>
  <div id="settings" class="panel" hidden tabindex="-1"></div>
  <div id="toasts"></div>
  <script src="renderer.js"></script>
  <script src="panels.js"></script>
</body>
</html>
